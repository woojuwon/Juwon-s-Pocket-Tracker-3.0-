<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juwon's Pocket Tracker ✨</title>
    
    <!-- Ikon Comel Pilihan You[cite: 1] -->
    <link rel="icon" type="image/jpeg" href="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=">
    <link rel="apple-touch-icon" href="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=">

    <style>
        :root {
            --pastel-pink: #ffd1dc;
            --pastel-purple: #e2d1f9;
            --deep-purple: #8b5cf6;
            --text-dark: #4a4063;
            --bg-color: #fdf8fa;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .summary-card {
            background: linear-gradient(135deg, #ffd1dc, #e2d1f9);
            padding: 20px;
            border-radius: 24px;
            text-align: center;
            color: #4a4063;
            box-shadow: 0 10px 25px rgba(226, 209, 249, 0.4);
            margin-bottom: 20px;
            border: 2px solid white;
        }
        .summary-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            color: #6b46c1;
        }
        .summary-amount {
            font-size: 28px;
            font-weight: 700;
            color: #4a4063;
            margin-bottom: 12px;
        }
        .summary-grid {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid rgba(255,255,255,0.6);
            padding-top: 10px;
            font-size: 13px;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(226, 209, 249, 0.3);
            border: 2px solid var(--pastel-pink);
        }
        h2 {
            text-align: center;
            color: #6b46c1;
            margin-bottom: 4px;
            margin-top: 0;
            font-size: 22px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #6b46c1;
        }
        input, select {
            width: 100%;
            padding: 11px;
            border: 2px solid #f3e8ff;
            border-radius: 12px;
            font-size: 15px;
            background-color: #faf5ff;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--deep-purple);
            background-color: white;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f472b6, #a78bfa);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(244, 114, 182, 0.4);
            transition: transform 0.2s;
            margin-top: 10px;
        }
        button:active {
            transform: scale(0.98);
        }
        .loading {
            display: none;
            text-align: center;
            font-size: 14px;
            color: #a78bfa;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Kad Summary (Baki, Masuk, Keluar) -->
    <div class="summary-card">
        <div class="summary-title">Baki Semasa (Net Balance) 🌸</div>
        <div class="summary-amount" id="netBalance">RM 0.00</div>
        <div class="summary-grid">
            <div>Duit Masuk: <br><strong id="totalIncome" style="color: #059669;">RM 0.00</strong></div>
            <div>Duit Keluar: <br><strong id="totalExpense" style="color: #dc2626;">RM 0.00</strong></div>
        </div>
    </div>

    <!-- Kad Borang Input -->
    <div class="card">
        <h2>Juwon's Pocket Tracker ✨</h2>
        <div class="subtitle">Aesthetic & Fast Expense Logger</div>
        
        <form id="expenseForm">
            <div class="form-group">
                <label>Jenis Transaksi</label>
                <select id="type">
                    <option value="Expense">Duit Keluar (Expense) 💸</option>
                    <option value="Income">Duit Masuk (Income) レ</option>
                </select>
            </div>

            <div class="form-group">
                <label>Amount (RM)</label>
                <input type="number" step="0.01" id="amount" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label>Item Name / Sumber</label>
                <input type="text" id="itemName" placeholder="e.g. Gaji / ZUS Coffee ☕" required>
            </div>

            <div class="form-group">
                <label>Category</label>
                <select id="category">
                    <option value="Food">Food 🍔</option>
                    <option value="Transport">Transport 🚗</option>
                    <option value="Shopping">Shopping 🛍️</option>
                    <option value="Bills">Bills 💡</option>
                    <option value="Salary">Salary / Gaji 💰</option>
                    <option value="MARA">MARA 📚</option>
                    <option value="PTPTN">PTPTN 🎓</option>
                    <option value="Parents">Parents 💐</option>
                    <option value="Others">Others ✨</option>
                </select>
            </div>

            <div class="form-group">
                <label>Payment Method</label>
                <select id="paymentMethod">
                    <option value="Cash">Cash 💵</option>
                    <option value="Online Banking">Online Banking 📱</option>
                    <option value="e-Wallet">e-Wallet 💳</option>
                    <option value="Credit/Debit Card">Credit/Debit Card 🏧</option>
                </select>
            </div>

            <div class="form-group">
                <label>Notes (Optional)</label>
                <input type="text" id="notes" placeholder="Any extra notes...">
            </div>

            <button type="submit" id="submitBtn">Save Record ✨</button>
            <div class="loading" id="loadingText">Saving to your cute sheet... 🌸</div>
        </form>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz1akYaat-H3RSoDxjpM0hC8pjL72tYEN9b56onJECqLPysxXuPz_tPK3iZsmv5ojmf/exec";

    // Tarik data summary dari Google Sheet
    window.addEventListener('DOMContentLoaded', function() {
        fetch(WEB_APP_URL)
        .then(response => response.json())
        .then(data => {
            if(data.balance) {
                document.getElementById('netBalance').innerText = 'RM ' + data.balance;
                document.getElementById('totalIncome').innerText = 'RM ' + data.income;
                document.getElementById('totalExpense').innerText = 'RM ' + data.expense;
            }
        })
        .catch(err => console.log('Gagal muat summary:', err));
    });

    // Hantar rekod baru
    document.getElementById('expenseForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const loading = document.getElementById('loadingText');
        
        btn.style.display = 'none';
        loading.style.display = 'block';

        const data = {
            type: document.getElementById('type').value,
            amount: document.getElementById('amount').value,
            itemName: document.getElementById('itemName').value,
            category: document.getElementById('category').value,
            paymentMethod: document.getElementById('paymentMethod').value,
            notes: document.getElementById('notes').value,
            date: new Date().toISOString().split('T')[0]
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
        })
        .then(() => {
            alert('Yay! Berjaya rekod transaksi! 💖');
            document.getElementById('expenseForm').reset();
            btn.style.display = 'block';
            loading.style.display = 'none';
            setTimeout(() => { location.reload(); }, 1000);
        })
        .catch(error => {
            alert('Eh ada ralat sikit: ' + error);
            btn.style.display = 'block';
            loading.style.display = 'none';
        });
    });
</script>

</body>
</html>
